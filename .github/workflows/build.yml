name: build-skopeo-static

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动点击按钮触发
  schedule:
  # 每天凌晨 2 点（UTC时间，即北京时间上午10点）触发一次
  # https://crontab.guru/ 是一个设置 cron 的好帮手
  - cron: '0 2 */7 * *' 

jobs:
  build:
    name: Build for ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            gcc: gcc
          - arch: arm64
            goarch: arm64
            gcc: aarch64-linux-gnu-gcc
    outputs:
      # 定义一个作业输出变量
      VERSION:  ${{ steps.get_tag.outputs.TAG }}
    steps:
      - name: Get Latest Tag via GH CLI
        id: get_tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 使用官方 CLI 获取最新 tag，更稳定
          TAG=$(gh release view --repo containers/skopeo --json tagName --template '{{.tagName}}')
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Latest tag is $TAG"

      - name: Checkout Skopeo Source
        uses: actions/checkout@v4
        with:
          repository: containers/skopeo
          ref: ${{ steps.get_tag.outputs.TAG }} # 此时确保了 TAG 绝对不为 null


      - name: Check if Tag Exists in This Repo
        id: check_tag
        env:
          GITHUB_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.get_tag.outputs.TAG }}"
          
          # 使用 GitHub API 检查该 Tag 是否已存在
          # 注意：这里检查的是 Git Tag，Release 是基于 Tag 的
          if gh api "/repos/ ${{ github.repository }}/git/ref/tags/ $ TAG_NAME" --silent; then
            echo "Tag  $ TAG_NAME 已存在，无需重新编译。"
            echo "SKIP_BUILD=true" >>  $ GITHUB_OUTPUT
          else
            echo "Tag  $ TAG_NAME 不存在，准备编译。"
            echo "SKIP_BUILD=false" >>  $ GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.check_tag.outputs.SKIP_BUILD != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Dependencies (Fixed for Noble)
        if: steps.check_tag.outputs.SKIP_BUILD != 'true'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            echo "⚙️ 配置 ARM64 交叉编译环境..."

            # 1. 注册架构
            sudo dpkg --add-architecture arm64

            # 2. 暴力清理旧源配置，防止冲突
            echo "🧹 清空 /etc/apt/sources.list.d/ ..."
            sudo rm -f /etc/apt/sources.list.d/* 
            sudo cp /etc/apt/sources.list /etc/apt/sources.list.bak
            # 3. 重写默认源 (仅保留 amd64)
            # 目的：下载交叉编译工具链 (gcc-aarch64-linux-gnu)
            echo "📝 写入 amd64 默认源..."
            echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
            echo "deb [arch=amd64] http://archive.ubuntu.com/ubuntu/ noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
            echo "deb [arch=amd64] http://security.ubuntu.com/ubuntu/ noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list

            # 4. 写入 arm64 Ports 源
            # 目的：下载目标库文件
            echo "📝 写入 arm64 Ports 源..."
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64-ports.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64-ports.list

          else
            echo "⚙️ 判断为 AMD64 本地编译环境..."
          fi

      - name: Install Dependencies
        run: |
          # 1. 清理并更新索引
          sudo apt-get clean
          sudo apt-get update --fix-missing

          # 2. 安装通用工具
          sudo apt-get install -y pkg-config

          # 3. 安装特定依赖
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            # 安装交叉编译器
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu

            # 严格检查编译器
            if ! command -v aarch64-linux-gnu-gcc &> /dev/null; then
              echo "❌ 交叉编译器安装失败！"
              exit 1
            fi

            # 安装 arm64 依赖库
            sudo apt-get install -y \
              libgpgme-dev:arm64 \
              libassuan-dev:arm64 \
              libdevmapper-dev:arm64 \
              libbtrfs-dev:arm64 \
              libssl-dev:arm64
          else
            # amd64 本地编译
            sudo apt-get install -y \
              libgpgme-dev \
              libassuan-dev \
              libbtrfs-dev \
              libdevmapper-dev \
              libssl-dev
          fi





      - name: Build
        if: steps.check_tag.outputs.SKIP_BUILD != 'true'
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.gcc }}
          PKG_CONFIG_PATH: ${{ matrix.arch == 'arm64' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '/usr/lib/x86_64-linux-gnu/pkgconfig' }}
        run: |
          # 1. 设置 CGO 链接参数，强制 GCC 进行静态链接
          # 这将解决 GLIBC 版本不匹配的问题
          export CGO_LDFLAGS="-static -L/usr/lib/${{ matrix.arch == 'arm64' && 'aarch64-linux-gnu' || 'x86_64-linux-gnu' }}"
          
          # 2. 执行编译
          # 增加 'static' build tag
          make bin/skopeo BUILDTAGS="containers_image_openpgp static exclude_graphdriver_devicemapper"
          
          # 3. 验证是否为静态链接
          # 如果输出包含 "statically linked"，说明成功；如果仍是 "dynamically linked"，
          # 说明某些 C 库（如 gpgme）在宿主机上只有动态库版本，此时它仍能在较低版本系统运行（只要链接成功）
          file bin/skopeo
          ldd bin/skopeo || echo "Statically linked"

          mkdir -p out/bin
          cp bin/skopeo out/bin/
          tar -czf skopeo-${{ steps.get_tag.outputs.TAG }}-${{ matrix.arch }}.tar.gz -C out bin


      - name: Upload Artifacts
        if: steps.check_tag.outputs.SKIP_BUILD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skopeo-${{ matrix.arch }}
          path: skopeo-*.tar.gz
          
      - name: Expose Version
        if: steps.check_tag.outputs.SKIP_BUILD != 'true'
        run: |
          # 将版本号传递给依赖此 Job 的其他 Job
          echo "VERSION= ${{ steps.get_tag.outputs.TAG }}" >>  $ GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./
          pattern: skopeo-*
          merge-multiple: true

      - name: Create GitHub Release
        if: needs.build.outputs.VERSION != ''
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          # ⚠️ 关键：这里使用动态的 Tag 名
          tag:  ${{ needs.build.outputs.VERSION }} # 直接使用上游的 Tag
          name: "Skopeo Auto Build  ${{ needs.build.outputs.VERSION }}"
          artifacts: "skopeo-*.tar.gz"
          body: "Automated static build for Skopeo  ${{ needs.build.outputs.VERSION }}"
